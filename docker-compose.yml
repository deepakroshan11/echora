# docker-compose.yml — Local development only
# Runs LibreTranslate + ShortsDub backend together.
# NOT used in production (each runs as a separate HF Space / Render service).
#
# Usage:
#   docker-compose up --build
#   Then: cd frontend && npm run dev (in a separate terminal)

services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/languages"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # LibreTranslate takes time to download language models on first run

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TRANSLATE_URL=http://libretranslate:5000/translate
      - UPLOADS_DIR=uploads
      - JOBS_DIR=jobs
      - MAX_FILE_SIZE_MB=500
    depends_on:
      libretranslate:
        condition: service_healthy
    volumes:
      # Mount uploads/jobs as volumes for persistence across restarts
      - ./backend/uploads:/app/uploads
      - ./backend/jobs:/app/jobs
    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
